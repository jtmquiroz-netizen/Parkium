<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Parkium · Test de conexión</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#0b1220;color:#e2e8f0;
         display:grid;place-items:center;height:100vh;margin:0}
    .card{background:#111c33;border:1px solid #1e2a44;border-radius:12px;
          padding:28px 34px;max-width:520px}
    h1{color:#3b82f6;margin:0 0 6px} .ok{color:#22d3ee;font-weight:bold}
    .err{color:#f87171} pre{color:#94a3b8;font-size:13px;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="card">
    <h1>Parkium</h1>
    <div id="salida">Conectando a Supabase…</div>
    <pre id="detalle"></pre>
  </div>

  <!-- Cliente de Supabase + capa de Parkium -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="parkium-api.js"></script>
  <script>
    (async () => {
      const out = document.getElementById("salida");
      const det = document.getElementById("detalle");
      try {
        const centros = await ParkiumAPI.getCentros();
        const centro  = centros[0];
        const r       = await ParkiumAPI.getResumen(centro.id);
        out.innerHTML =
          `<span class="ok">✓ Conexión OK</span><br><br>` +
          `<b>${centro.nombre}</b> (${centro.comuna})<br>` +
          `${r.total} plazas · ${r.disponibles} libres · ${r.ocupada} ocupadas · ` +
          `${r.reservada} reservadas · ${r.pct_ocupacion}% ocupación`;
        det.textContent = "Tarifa: $" + centro.tarifa_hora + "/hora  ·  centro_id: " + centro.id;
      } catch (e) {
        out.innerHTML = `<span class="err">✗ Error de conexión</span>`;
        det.textContent = e.message;
      }
    })();
  </script>
</body>
</html>
